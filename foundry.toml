[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# Ethereum Classic stops at Spiral (Shanghai without withdrawals).
# No Cancun opcodes (MCOPY, TSTORE/TLOAD, BLOBHASH), no EIP-1559, no EIP-7702.
evm_version = "shanghai"
via_ir = true
optimizer = true
optimizer_runs = 200
# The tests call the TypeScript signer (signer/src/cli.ts) over FFI.
ffi = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
classic = "https://rpc.classix.dev"
