[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
# Ethereum Classic mainnet and Mordor stop at Spiral (Shanghai without withdrawals).
# No Cancun opcodes (MCOPY, TSTORE/TLOAD, BLOBHASH), no EIP-1559, no EIP-7702.
evm_version = "shanghai"
via_ir = true
optimizer = true
optimizer_runs = 200
# The vendored leanSPHINCS test calls the Python reference signer over FFI.
ffi = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
mordor = "https://rpc.mordor.etccooperative.org"
classic = "https://rpc.classix.dev"
